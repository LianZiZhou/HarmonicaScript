name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: build+test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HarmonicaScript.slnx

      - name: Build
        run: dotnet build HarmonicaScript.slnx -c Release --no-restore

      - name: Test (all five suites)
        run: dotnet test HarmonicaScript.slnx -c Release --no-build

      # Verify writes *.received.* next to the golden file when a snapshot changes.
      # Surfacing them as an artefact is what makes a golden diff reviewable in a PR.
      - name: Upload Verify received files
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-received-${{ matrix.os }}
          path: '**/*.received.*'
          if-no-files-found: ignore

  golden-change-trailer:
    name: golden files need a GOLDEN-CHANGE trailer
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A golden file is an assertion about behaviour. Changing one silently is how a
      # regression gets normalised, so every such change must state what moved and why.
      - name: Check
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD -- '*.verified.*' || true)
          if [ -z "$changed" ]; then echo "no golden files changed"; exit 0; fi
          echo "changed golden files:"; echo "$changed" | sed 's/^/  /'
          if git log "$base"..HEAD --format=%B | grep -q '^GOLDEN-CHANGE:'; then
            echo "GOLDEN-CHANGE trailer present"
          else
            echo "::error::Golden files changed but no commit carries a 'GOLDEN-CHANGE: <what moved and why>' trailer."
            exit 1
          fi
