# The developer has no Windows machine and ACE bans VMs, so this free runner is the
# only place most of the Windows path can be exercised at all. Its job is to shrink the
# unverifiable surface down to literally one question: does Delta Force accept injected
# input. Nothing here involves the game.
name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # M0 spike (b), part 1: the artefact must be produced ON macOS, because that is the
  # only machine that will ever cut a release. Building it on Windows would prove nothing.
  cross-publish:
    name: cross-publish win-x64 from macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish CLI (win-x64, self-contained, portable)
        run: >
          dotnet publish src/HarmonicaScript.Cli -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false -o artifacts/win-x64/cli

      - name: Publish GUI (win-x64, self-contained, portable)
        run: >
          dotnet publish src/HarmonicaScript.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false -o artifacts/win-x64/app

      # Decision D2: DryWetMidi's build/*.targets copies Native32.dll / Native64.dll /
      # Native64.dylib into every output dir on every platform. ExcludeAssets="build"
      # strips them. If that ever regresses we ship three useless native blobs and,
      # worse, re-open the door to the Multimedia layer we deliberately do not use.
      - name: Assert no DryWetMidi native blobs leaked
        run: |
          leaks=$(find artifacts/win-x64 \( -iname 'Native32*' -o -iname 'Native64*' \) -print)
          if [ -n "$leaks" ]; then echo "::error::DryWetMidi native blobs leaked:"; echo "$leaks"; exit 1; fi
          echo "clean: no native blobs"

      - uses: actions/upload-artifact@v7
        with:
          name: win-x64
          path: artifacts/win-x64
          retention-days: 7

  # M0 spike (b), part 2: the macOS-produced exe must actually LAUNCH on real Windows.
  # This is the check that catches a cross-compilation regression before a user does.
  windows-smoke:
    name: launch macOS-built exe on Windows
    needs: cross-publish
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: win-x64
          path: artifacts

      # NOT a bare `hsc.exe`: with System.CommandLine a root command invoked with no
      # subcommand prints help and exits 1 by design, so asserting 0 there tests nothing and
      # fails for the wrong reason. These two do real work instead - `targets` in particular
      # only succeeds if the exe found and parsed its own data/ profiles and key table.
      - name: CLI launches and loads its profiles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = & artifacts\cli\hsc.exe --version
          if ($LASTEXITCODE -ne 0) { throw "hsc.exe --version exited $LASTEXITCODE" }
          Write-Host "hsc.exe version: $version"

          # -join is load-bearing: PowerShell's -match/-notmatch against a STRING ARRAY filters
          # the array rather than returning a boolean, so `if ($lines -notmatch 'x')` is truthy
          # whenever ANY line fails to match - i.e. almost always. Compare against one string.
          $targets = (& artifacts\cli\hsc.exe targets) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "hsc.exe targets exited $LASTEXITCODE" }
          if ($targets -notmatch 'ahk-v2') { throw "expected ahk-v2 in the target list" }

          $candidates = (& artifacts\cli\hsc.exe profile candidates) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "hsc.exe profile candidates exited $LASTEXITCODE" }
          if ($candidates -notmatch '6 states, offsets -12\.\.25 \(38\), 48 renderings') {
            throw "emission table differs on Windows"
          }
          Write-Host "macOS-built exe loaded its profiles correctly on Windows"

      # Renders a real window on a real Windows desktop session and exits 0.
      #
      # Start-Process rather than `&`: HarmonicaScript.App is a WinExe, so on Windows the call
      # operator does NOT wait for it and $LASTEXITCODE is never set - which reads as a failure
      # while the app is in fact rendering fine a moment later. This waits for the real process,
      # takes its real exit code, and asserts on what it printed rather than only on the code.
      - name: GUI renders a window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $proc = Start-Process -FilePath artifacts\app\HarmonicaScript.App.exe `
                                -ArgumentList '--smoke' `
                                -PassThru `
                                -RedirectStandardOutput smoke-out.txt `
                                -RedirectStandardError smoke-err.txt

          if (-not $proc.WaitForExit(120000)) {
            $proc.Kill()
            throw "App --smoke did not exit within 120s - the window never finished rendering"
          }

          $out = (Get-Content smoke-out.txt -Raw -ErrorAction SilentlyContinue) ?? ''
          $err = (Get-Content smoke-err.txt -Raw -ErrorAction SilentlyContinue) ?? ''
          Write-Host $out
          if ($err.Trim()) { Write-Host "stderr: $err" }

          if ($proc.ExitCode -ne 0) { throw "App --smoke exited $($proc.ExitCode)" }
          if ($out -notmatch 'SMOKE OK') { throw "the app exited 0 but never reported a rendered window" }

  # Native Windows build+test. From M9 this job also drives SendInput into a real Win32
  # window, executes the generated .ahk with Send stubbed, and records scheduler p99
  # deadline error.
  windows-native:
    name: build+test on Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build HarmonicaScript.slnx -c Release
      - run: dotnet test HarmonicaScript.slnx -c Release --no-build
